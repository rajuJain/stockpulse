version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: stockpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stockpulse
      MYSQL_USER: stockpulse
      MYSQL_PASSWORD: stockpulse_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stockpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: stockpulse-api
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: stockpulse
      DB_PASSWORD: stockpulse_dev
      DB_NAME: stockpulse
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-secret-change-in-production-to-a-64-char-string
      JWT_ACCESS_EXPIRES_IN: 15m
      CORS_ORIGINS: http://localhost:4200,http://localhost:8100
      MARKET_DATA_SIMULATE: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: stockpulse-web
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data:
  redis_data:
