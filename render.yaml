# Render Blueprint — auto-provisions StockPulse backend
# Docs: https://render.com/docs/blueprint-spec
#
# Place this at the REPO ROOT (not in deploy/render/) for Render to detect it.
# This is automatically copied to the root by Part 1 of RENDER-DEPLOY.md.

services:
  - type: web
    name: stockpulse-api
    runtime: node
    plan: free
    region: oregon              # closest to Vercel's default edge
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/auth/me   # 401 response counts as "up"
    autoDeploy: true                   # redeploy on every git push to main
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000              # Render sets this automatically; we honor it
      - key: NODE_VERSION
        value: 20

      # ─── Database (you fill these in the Render UI after first deploy) ───
      - key: DB_HOST
        sync: false               # prompts the user
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false               # paste full PEM cert from Aiven

      # ─── JWT (Render auto-generates this if you click "Generate") ────────
      - key: JWT_ACCESS_SECRET
        generateValue: true       # Render generates a 64-char random string
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ─── CORS (update after Vercel deploy with the actual URL) ───────────
      - key: CORS_ORIGINS
        value: https://stockpulse.vercel.app,http://localhost:4200

      # ─── Razorpay (use test keys until you have real ones) ───────────────
      - key: RAZORPAY_KEY_ID
        value: rzp_test_dummy
      - key: RAZORPAY_KEY_SECRET
        value: dummy_secret

      # ─── Market data (simulate prices since we have no Upstox key) ──────
      - key: MARKET_DATA_SIMULATE
        value: "true"
